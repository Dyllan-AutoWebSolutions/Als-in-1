# Als-in-1 Tuindienste — Netlify config.
# The site is hand-coded with no build step. The "build" below only copies the
# public files into dist/ so reference/, content/ and the handoff docs never deploy.

[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html 404.html robots.txt sitemap.xml woonhuise plase kontak dankie privaatheid css js fonts images assets dist/"

# Pretty URLs: every page is a folder with index.html (/woonhuise/).
# Old mockup-style links redirect to the clean URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/woonhuise.html"
  to = "/woonhuise/"
  status = 301

[[redirects]]
  from = "/plase.html"
  to = "/plase/"
  status = 301

[[redirects]]
  from = "/kontak.html"
  to = "/kontak/"
  status = 301

# Anything not found gets the custom 404 page with a real 404 status.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------- Security headers (all pages) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Self only. Netlify Forms post to the site's own origin, so form-action 'self' covers them.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-cNQ5vmdUyFDWHeuoKogq+/+UF4NKDHMPX/CavkEP/zo='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

# ---------- Cache headers ----------
# Fonts never change.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS are linked with ?v=N. Bump N in every page's <head> when either file changes.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are swapped in place (placeholder -> real photo, same filename), so cache for
# 30 days rather than forever.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
